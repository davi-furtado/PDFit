<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PDFit - Página não encontrada."
    />
    <title>Página não encontrada | PDFit</title>
  </head>
  <body>
    <header>
      <a class="brand" data-home href="index.html">PDFit</a>
      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Mudar para modo claro"
        title="Mudar para modo claro"
      ></button>
    </header>
    <main>
      <section class="card" aria-labelledby="not-found-title">
        <p class="code" aria-hidden="true">404</p>
        <h1 id="not-found-title">Página não encontrada</h1>
        <p>
          O endereço acessado não existe ou foi movido. Volte para o início
          para continuar criando seus PDFs.
        </p>
        <a class="button" data-home href="index.html">Voltar para o início</a>
      </section>
    </main>
    <script>
      const pdfitAssetBasePath = location.pathname.startsWith('/PDFit/')
        ? '/PDFit/'
        : '/'
      const pdfitAppendLink = (rel, href) => {
        const link = document.createElement('link')
        link.rel = rel
        link.href = `${pdfitAssetBasePath}${href}`
        document.head.appendChild(link)
      }
      const pdfitAppendScript = (src) => {
        const script = document.createElement('script')
        script.src = `${pdfitAssetBasePath}${src}`
        document.body.appendChild(script)
      }

      pdfitAppendLink('icon', 'favicon.ico')
      pdfitAppendLink('stylesheet', 'css/bootstrap-icons.min.css')
      pdfitAppendLink('stylesheet', 'css/404.css')
      pdfitAppendScript('js/404.js')
    </script>
  </body>
</html>
