<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor de treino | PDFit</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="app-shell">
    <header class="app-header container">
      <a class="brand" href="index.html">PDFit</a>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
    </header>
    <main class="container py-4 py-md-5">
      <a class="back-link" href="treino-novo.html"
        ><i class="bi bi-arrow-left" aria-hidden="true"></i> Dados iniciais</a
      >
      <section class="content-card mt-3">
        <div
          class="d-flex flex-wrap justify-content-between align-items-start gap-3"
        >
          <div>
            <span class="eyebrow">Editor de treino</span>
            <h1 id="workout-heading"></h1>
          </div>
          <button class="btn btn-primary" id="generate-workout" type="button">
            <i class="bi bi-file-earmark-pdf" aria-hidden="true"></i> Gerar PDF
            do treino
          </button>
        </div>
        <div
          id="day-tabs"
          class="nav nav-pills gap-2 my-4"
          role="tablist"
        ></div>
        <div id="day-editor"></div>
        <hr class="my-4" />
        <label class="form-label" for="general-comment"
          >Comentário geral do treino</label
        >
        <textarea class="form-control" id="general-comment" rows="3"></textarea>
      </section>
    </main>
    <div id="pdf-output" class="pdf-output"></div>
    <script src="js/html2pdf.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      PDFit.initWorkoutEditor()
    </script>
  </body>
</html>
