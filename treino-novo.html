<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo treino | PDFit</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="app-shell">
    <header class="app-header container">
      <a class="brand" href="index.html">PDFit</a>
      <button class="theme-toggle" id="theme-toggle" type="button"></button>
    </header>
    <main class="container py-4 py-md-5">
      <a class="back-link" href="index.html"
        ><i class="bi bi-arrow-left" aria-hidden="true"></i> Início</a
      >
      <section class="content-card mt-3">
        <span class="eyebrow">Novo treino</span>
        <h1>Dados iniciais</h1>
        <form id="new-workout-form" class="row g-3">
          <div class="col-12">
            <label class="form-label" for="student-name">Nome do aluno</label>
            <input class="form-control" id="student-name" required />
          </div>
          <div class="col-12">
            <label class="form-label" for="split">Divisão do treino</label>
            <select class="form-select" id="split" required>
              <option value="">Selecione</option>
              <option value="AB">AB</option>
              <option value="ABC">ABC</option>
              <option value="ABCD">ABCD</option>
            </select>
          </div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit">
              <i class="bi bi-pencil-square" aria-hidden="true"></i> Abrir
              editor
            </button>
          </div>
        </form>
      </section>
    </main>
    <script src="js/app.js"></script>
    <script>
      PDFit.initNewWorkout()
    </script>
  </body>
</html>
